# План RNN-экспериментов.
# Файл намеренно простой: его можно парсить напрямую или использовать
# как источник правды при реализации runner'а.

defaults:
  seed: 42
  model_type: gru
  event_dim: 64
  hidden_dim: 128
  num_layers: 1
  dropout: 0.0
  max_len: 128
  stride: 64
  batch_size: 128
  epochs: 5
  lr: 0.001
  pooling: last
  downstream_horizons: [7, 14]
  downstream_metrics: [roc_auc, pr_auc]

series:
  context_saturation:
    description: "Сколько раннего поведения пользователя достаточно для retention?"
    base_checkpoint: artifacts/rnn/rnn_encoder.pt
    model_type: gru
    pooling: last
    prefix_lengths: [25, 50, 75, 100, 150, 200, 300]
    stop_rule:
      min_roc_auc_gain: 0.002
      track_valid_users: true

  pooling_ablation:
    description: "Как агрегировать hidden states RNN в user embeddings?"
    base_checkpoint: artifacts/rnn/rnn_encoder.pt
    model_type: gru
    prefix_len: 150
    pooling: [last, mean, max, last_mean]

  capacity_sweep:
    description: "Улучшает ли большая capacity sequence- и downstream-метрики?"
    pooling: max
    prefix_len: 150
    experiments:
      - experiment_id: gru_h64_l1
        model_type: gru
        hidden_dim: 64
        num_layers: 1
        dropout: 0.0
      - experiment_id: gru_h128_l1_ref
        model_type: gru
        hidden_dim: 128
        num_layers: 1
        dropout: 0.0
        source: reference
      - experiment_id: gru_h256_l1
        model_type: gru
        hidden_dim: 256
        num_layers: 1
        dropout: 0.0
      - experiment_id: gru_h128_l2_d02
        model_type: gru
        hidden_dim: 128
        num_layers: 2
        dropout: 0.2
      - experiment_id: gru_h256_l2_d02
        model_type: gru
        hidden_dim: 256
        num_layers: 2
        dropout: 0.2
      - experiment_id: lstm_h128_l1_ref
        model_type: lstm
        hidden_dim: 128
        num_layers: 1
        dropout: 0.0
        source: reference

  supervised_retention:
    description: "Может ли supervised training на retention обогнать self-supervised next-event embeddings?"
    model_type: gru
    prefix_len: 150
    targets: [retention_7d, retention_14d]
    compare_to:
      - tabular_baseline
      - next_event_gru_embeddings
      - tabular_plus_gru_embeddings

  final_stability:
    description: "Насколько устойчив финальный RNN-кандидат к seed?"
    candidate: gru_h256_l1_max_prefix150
    seeds: [42, 43, 44]
    metrics: [roc_auc, pr_auc]

  negative_controls:
    description: "Проверяют, что эффект RNN не объясняется размерностью или частотными признаками."
    controls: [random_embeddings, bag_of_events, shuffled_order]

  order_sensitivity:
    description: "Проверяет, насколько RNN-эмбеддинг реагирует на перестановку событий."
    compare: [gru_mean_prefix150, shuffled_gru_mean_prefix150]

  embedding_analysis:
    description: "Диагностика геометрии пространства эмбеддингов и кластеров пользователей."
    methods: [pca, kmeans, norm_statistics]

  full_history:
    description: "Отдельный full-history режим для командного сопоставления с SimCLR и BERT4Rec."
    max_len: 512
    pooling: max
    metrics: [roc_auc, pr_auc, mrr, hit@10]

  full_history_aligned:
    description: "Aligned full-history RNN на SimCLR processed sequences для прямого командного сравнения."
    source_sequences: SimCLR processed train/val/test sequences
    max_len: 512
    pooling: max
    users: [47875, 10259, 10260]
    labels: [retention_1d, retention_7d, retention_14d, retention_30d]
